<!-- Style des contenus -->
<style>
html {
    font-size: 18px;
    min-height: calc(100dvh - 1em);
}
body {
    min-height: calc(100dvh - 1em);
    display: flex;
    flex-direction: column;
    padding: 0 0.8em 0em;
    background-color: black;
    color: white;
    font-family: 'Computer Modern Serif', serif;
    line-height: 1.6;
}
main {
    min-height: 0;
    margin-top: -2em;
}
footer {
    text-align: center;
    font-size: 0.85em;
    margin-top: auto;
    margin-bottom: 0;
}
* { box-sizing: border-box; } /* footer en bas de la pge */
h1, h2, h3 {
    text-align: center;
    font-family: 'Computer Modern Serif', serif;
    margin-bottom: 0.2em;
}
h3 {
    font-weight: 300;
}
.retour-accueil {
    margin-top: 0;
    margin-bottom: 1rem;
}
.menu-niveaux {
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 3rem;
    margin-bottom: 0;
    margin-left: auto;
    margin-right: auto;
    max-width: 1100px;
}
@media (max-width: 700px) {
    .menu-niveaux {
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    }
}
.bloc {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    width: clamp(250px, 30vw, 450px);
    height: clamp(150px, 18vw, 270px);
    margin: 1rem auto;
    border-radius: 10px;
    text-decoration: none;
    color: white;
    font-size: 1.4rem;
    font-weight: bold;
}
.bloc .poster ,
.bloc video {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.bloc .poster {
    z-index: -1;
}
.bloc video {
    z-index: 0;
}
.bloc video::-webkit-media-controls {
    display: none !important;
    -webkit-appearance: none;
}
.bloc video::-webkit-media-controls-enclosure {display: none !important;}
.bloc video::-webkit-media-controls-panel {display: none !important;}
.bloc h2 {
    position: relative;
    z-index: 1;
    margin: 0;
    text-align: center;
}
.bloc-premiere { border: 2px solid blue; }
.bloc-premiere:hover {
color: #5cbcff;
}
.bloc-premiere:hover h2 {
color: #486dff;
}
.bloc-premiere:hover video {
filter: brightness(0.6);
}

<!-- Boutons -->
<style>
.btn-groupe {
  display: inline-flex;
  gap: 0.25rem;
  border-radius: 999px;
  overflow: hidden;
}

.btn-retour {
  display: inline-flex;               /* au lieu d’inline-block */
  align-items: center;                /* centre verticalement le texte */
  justify-content: center;            /* centre horizontalement */
  padding: 0.08rem 0.6rem;
  border: 1.5px solid rgba(255, 255, 255, 0.25);
  border-radius: 999px;
  color: rgba(255, 255, 255, 0.92);
  text-decoration: none;
  font-weight: 600;
  font-size: 0.95em;
  font-family: 'Computer Modern Serif', serif;
  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(8px) saturate(180%);
  -webkit-backdrop-filter: blur(8px) saturate(180%);
  box-shadow:
    inset 0 0 6px rgba(255,255,255,0.1),
    0 0 4px rgba(255,255,255,0.05);
  transition:
    background 0.25s ease,
    box-shadow 0.25s ease,
    transform 0.2s ease,
    border-color 0.25s ease;
}

.btn-retour:hover {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.35);
  box-shadow:
    inset 0 0 10px rgba(255,255,255,0.15),
    0 0 10px rgba(255,255,255,0.1);
  transform: translateY(0px);
}

.btn-retour:active {
  transform: translateY(0);
  background: rgba(255, 255, 255, 0.08);
  box-shadow:
    inset 0 0 8px rgba(255,255,255,0.1),
    0 0 3px rgba(255,255,255,0.05);
}
.btn-retour sup {
  font-size: 0.6em;
  position: relative;
  top: -0.35em; /* remonte l’exposant visuellement */
}
</style>

<!-- Bannière hero -->
<style>

  width: 100%;
  height: 120px; /* hauteur de la bannière */

.hero-image {

  width: auto;
  transform: translate(-0%, 4%);

  opacity: 0.99; /* légère transparence pour lisibilité du texte */

}

.hero-title {

  font-family: 'Computer Modern Serif', serif;
  font-size: 2.2em;
  font-weight: 700;
  text-align: center;

<!-- Vidéos -->
<script>
(function () {
  function tryPlayOrHide(video) {
    // Essayer de jouer la vidéo
    const playPromise = video.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => {
        // Attendre un peu pour être sûr que ce n’est pas juste un retard
        setTimeout(() => {
          if (video.paused) {
            video.style.display = 'none'; // Autoplay bloqué → cacher la vidéo
          }
        }, 50);
      });
    }
  }

  function resumeAll(fromBFCache) {
    document.querySelectorAll('video[autoplay]').forEach(v => {
      v.muted = true;      // requis pour l’autoplay
      v.playsInline = true;

      const targetTime = fromBFCache && v.dataset.t ? parseFloat(v.dataset.t) : null;

      if (v.readyState < 2) { // pas encore de données décodées
        if (targetTime != null) {
          v.addEventListener('loadedmetadata', () => {
            try { v.currentTime = targetTime; } catch {}
          }, { once: true });
        }
        v.addEventListener('loadeddata', () => tryPlayOrHide(v), { once: true });
        v.load(); // “réveille” le décodage sur Safari après bfcache
      } else {
        if (targetTime != null) try { v.currentTime = targetTime; } catch {}
        if (v.paused) tryPlayOrHide(v);
      }
    });
  }

  // Sauvegarde de la position à la sortie
  window.addEventListener('pagehide', e => {
    if (e.persisted) {
      document.querySelectorAll('video[autoplay]').forEach(v => {
        v.dataset.t = v.currentTime || 0;
      });
    }
  });

  // Reprise après retour depuis l’historique
  window.addEventListener('pageshow', e => {
    resumeAll(e.persisted === true);
  });

  // Filet de sécurité quand l’onglet redevient visible
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) resumeAll(false);
  });

  // Lancer au chargement initial
  document.addEventListener('DOMContentLoaded', () => {
    resumeAll(false);
  });
})();
</script>
</body>
